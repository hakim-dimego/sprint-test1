<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SprintTrack Pro | Video AI Auto-Start</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { margin: 0; background-color: #05050A; color: white; font-family: sans-serif; overflow: hidden; height: 100dvh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .ready-pulse { animation: pulse 1.5s infinite; color: #fbbf24; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="app-container" class="relative w-full h-full flex flex-col">
    <div id="viewport" class="relative flex-1 overflow-hidden bg-black">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        
        <div class="absolute top-10 inset-x-0 px-6 flex justify-between items-start z-50">
            <div class="glass rounded-2xl p-3">
                <span id="status-text" class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Warte auf Video...</span>
            </div>
        </div>

        <div id="trigger-overlay" class="hidden absolute inset-0 flex items-center justify-center bg-black/50 z-[60]">
            <div class="text-center">
                <div id="trigger-msg" class="text-5xl font-black italic ready-pulse uppercase">Ready</div>
                <p class="text-sm opacity-70 mt-2">Spiele das Video ab. KI wartet auf Start...</p>
            </div>
        </div>

        <div id="speed-bubble" class="hidden absolute top-32 right-6 glass rounded-2xl p-4 text-right z-50">
            <span id="live-speed" class="text-5xl font-black italic text-cyan-400">0.0</span>
            <span class="text-[10px] font-bold block opacity-50 uppercase">KM/H</span>
        </div>
    </div>

    <div id="controls" class="glass w-full p-6 pb-10 flex flex-col gap-4 z-50 rounded-t-[2.5rem]">
        <div class="flex flex-col gap-1">
            <label class="text-[10px] font-black uppercase tracking-[2px] opacity-60 ml-2">Körpergröße (m)</label>
            <input type="number" id="user-height" value="1.80" step="0.01" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-5 text-cyan-400 font-bold outline-none">
        </div>

        <div class="flex gap-3">
            <button onclick="document.getElementById('file-input').click()" class="flex-1 py-4 glass rounded-xl text-[10px] font-bold uppercase">📁 Video wählen</button>
            <button id="start-btn" onclick="armAutoStart()" class="flex-[2] py-5 bg-cyan-500 rounded-2xl text-black font-black text-lg uppercase tracking-[2px]">AI Aktivieren</button>
        </div>
        <input type="file" id="file-input" hidden accept="video/*" onchange="handleFileUpload(event)">
    </div>

    <div id="result-overlay" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-3xl flex flex-col items-center justify-center p-6">
        <div id="fc-card" class="relative w-64 h-96 rounded-[2rem] overflow-hidden transition-all duration-700">
            <div id="card-bg" class="absolute inset-0 bg-gradient-to-br from-amber-200 to-amber-600"></div>
            <div class="relative h-full flex flex-col items-center pt-10 text-slate-900 font-black italic uppercase">
                <span id="card-pace" class="text-6xl">0</span>
                <span class="text-xl -mt-1">PAC</span>
                <div class="text-2xl mt-12 border-b-2 border-black/20 w-4/5 text-center pb-1">SPRINTER</div>
                <div class="mt-4 flex flex-col items-center opacity-70">
                    <span id="res-kmh" class="text-lg">0.0 km/h</span>
                </div>
            </div>
        </div>
        <button onclick="location.reload()" class="mt-8 py-4 px-12 bg-cyan-500 text-black rounded-full font-black uppercase">Neu</button>
    </div>
</div>

<script>
    const state = {
        detector: null,
        isArmed: false,
        isMeasuring: false,
        peakKmh: 0,
        speedBuffer: [],
        lastPos: null,
        lastTime: null,
        startTimeInVideo: 0
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function init() {
        state.detector = await poseDetection.createDetector(poseDetection.SupportedModels.BlazePose, { runtime: 'tfjs', modelType: 'lite' });
        document.getElementById('status-text').innerText = "Bereit";
        render();
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                document.getElementById('status-text').innerText = "Video geladen";
            };
        }
    }

    function armAutoStart() {
        if (!video.src) return alert("Bitte zuerst Video wählen!");
        state.isArmed = true;
        state.peakKmh = 0;
        state.speedBuffer = [];
        state.lastPos = null;
        document.getElementById('trigger-overlay').classList.remove('hidden');
        document.getElementById('status-text').innerText = "Warte auf Bewegung...";
        video.play();
    }

    function render() {
        if (video.readyState >= 2) {
            state.detector.estimatePoses(video).then(poses => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (poses && poses[0]) {
                    const pose = poses[0];
                    drawPose(pose);
                    processAnalysis(pose);
                }
            });
        }
        requestAnimationFrame(render);
    }

    function processAnalysis(pose) {
        const k = pose.keypoints;
        const curTime = video.currentTime; // CRITICAL: Use video time for uploaded files
        const userH = parseFloat(document.getElementById('user-height').value) || 1.80;

        // Scale & Pos
        const pxH = Math.abs(((k[27].y + k[28].y)/2) - ((k[11].y + k[12].y)/2));
        const curX = (k[23].x + k[24].x) / 2;
        const curY = (k[23].y + k[24].y) / 2;

        if (state.lastPos && pxH > 20 && curTime !== state.lastTime) {
            const dt = curTime - state.lastTime;
            const dx = Math.hypot(curX - state.lastPos.x, curY - state.lastPos.y);
            const kmh = ((dx / (pxH / userH)) / dt) * 3.6;

            if (kmh < 60) {
                state.speedBuffer.push(kmh);
                if (state.speedBuffer.length > 3) state.speedBuffer.shift();
                const avg = state.speedBuffer.reduce((a,b)=>a+b,0) / state.speedBuffer.length;

                // TRIGGER LOGIC
                if (state.isArmed && avg > 4.0) { // Schwelle für Start
                    state.isArmed = false;
                    state.isMeasuring = true;
                    state.startTimeInVideo = curTime;
                    document.getElementById('trigger-overlay').classList.add('hidden');
                    document.getElementById('speed-bubble').classList.remove('hidden');
                    document.getElementById('status-text').innerText = "MESSUNG LÄUFT";
                }

                if (state.isMeasuring) {
                    state.peakKmh = Math.max(state.peakKmh, avg);
                    document.getElementById('live-speed').innerText = avg.toFixed(1);

                    // Stop after 4 seconds of video time or video end
                    if (curTime - state.startTimeInVideo > 4 || video.ended) {
                        state.isMeasuring = false;
                        video.pause();
                        showResult();
                    }
                }
            }
        }
        state.lastPos = { x: curX, y: curY };
        state.lastTime = curTime;
    }

    function drawPose(pose) {
        ctx.fillStyle = '#00F5FF';
        [11, 12, 23, 24, 27, 28].forEach(i => {
            const kp = pose.keypoints[i];
            if (kp.score > 0.5) {
                ctx.beginPath(); ctx.arc(kp.x, kp.y, 6, 0, Math.PI*2); ctx.fill();
            }
        });
    }

    function showResult() {
        const pace = Math.min(99, Math.max(10, Math.round(((state.peakKmh - 15) / (38 - 15)) * 57 + 40)));
        document.getElementById('card-pace').innerText = pace;
        document.getElementById('res-kmh').innerText = state.peakKmh.toFixed(1) + " km/h";
        document.getElementById('result-overlay').classList.remove('hidden');
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    init();
</script>
</body>
</html>
