<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprintTrack Pro | Final Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

<div class="relative w-full h-screen flex flex-col">
    <div class="relative flex-[3] bg-black">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="status" class="absolute top-5 left-5 glass px-4 py-2 rounded-full text-xs font-bold text-cyan-400">Warte auf Video...</div>
    </div>

    <div class="flex-1 glass p-6 flex flex-col gap-4">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black italic text-cyan-400">TOP SPEED TRACKER</h1>
            <input type="file" id="file-input" hidden accept="video/*" onchange="handleFile(event)">
            <button onclick="document.getElementById('file-input').click()" class="bg-white/10 px-4 py-2 rounded-lg text-xs font-bold uppercase">Video wählen</button>
        </div>
        
        <div class="flex gap-4 items-center">
            <div class="flex-1">
                <label class="text-[10px] uppercase opacity-50 block mb-1">Körpergröße (m)</label>
                <input type="number" id="user-height" value="1.80" step="0.01" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-cyan-400 outline-none">
            </div>
            <button id="run-btn" onclick="startAnalysis()" class="flex-[2] bg-cyan-500 text-black py-4 rounded-xl font-black uppercase tracking-widest shadow-lg shadow-cyan-500/30">Analyse Starten</button>
        </div>
    </div>
</div>

<div id="result" class="hidden fixed inset-0 z-[100] bg-black/90 flex items-center justify-center">
    <div class="bg-gradient-to-br from-yellow-400 to-amber-600 p-10 rounded-[3rem] text-center text-slate-900 shadow-2xl">
        <h2 id="pace" class="text-8xl font-black italic">0</h2>
        <p class="text-xl font-bold uppercase">PAC (Top Speed)</p>
        <p id="kmh" class="text-2xl font-black mt-4 border-t border-black/20 pt-4">0.0 KM/H</p>
        <button onclick="location.reload()" class="mt-8 bg-black text-white px-8 py-3 rounded-full font-bold uppercase text-xs">Neu starten</button>
    </div>
</div>

<script>
    let detector, isRunning = false, peakKmh = 0, lastPos = null, lastTime = null;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function init() {
        // "MoveNet" ist schneller als BlazePose und oft besser für Web-Apps auf iPhones
        detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, { modelType: poseDetection.movenet.modelType.SINGLEPOSE_THUNDER });
        document.getElementById('status').innerText = "Bereit";
        loop();
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                document.getElementById('status').innerText = "Video geladen";
            };
        }
    }

    function startAnalysis() {
        if (!video.src) return;
        video.currentTime = 0;
        peakKmh = 0;
        isRunning = true;
        video.play();
    }

    async function loop() {
        if (video.readyState >= 2) {
            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (poses && poses[0]) {
                const pose = poses[0];
                draw(pose);
                if (isRunning) calculate(pose);
                document.getElementById('status').innerText = "Person erkannt";
            } else {
                document.getElementById('status').innerText = "Suche Person...";
            }

            if (isRunning && video.ended) {
                isRunning = false;
                showResult();
            }
        }
        requestAnimationFrame(loop);
    }

    function calculate(pose) {
        const k = pose.keypoints;
        const h = parseFloat(document.getElementById('user-height').value) || 1.80;
        
        // Nutze den Abstand zwischen Schulter und Knöchel für die Skalierung (stabiler als ganze Größe)
        const shoulder = k.find(p => p.name === 'left_shoulder' || p.name === 'right_shoulder');
        const ankle = k.find(p => p.name === 'left_ankle' || p.name === 'right_ankle');
        const hip = k.find(p => p.name === 'left_hip' || p.name === 'right_hip');

        if (shoulder && ankle && hip && shoulder.score > 0.3 && ankle.score > 0.3) {
            const pxH = Math.abs(ankle.y - shoulder.y);
            const curX = hip.x;
            const now = video.currentTime;

            if (lastPos && now !== lastTime) {
                const dt = now - lastTime;
                const dx = Math.abs(curX - lastPos);
                const kmh = ((dx / (pxH / (h * 0.75))) / dt) * 3.6; // 0.75 Korrekturfaktor Schulter-Ankle

                if (kmh < 45 && kmh > 2) peakKmh = Math.max(peakKmh, kmh);
            }
            lastPos = curX;
            lastTime = now;
        }
    }

    function draw(pose) {
        ctx.fillStyle = "#00F5FF";
        pose.keypoints.forEach(kp => {
            if (kp.score > 0.3) {
                ctx.beginPath(); ctx.arc(kp.x, kp.y, 6, 0, Math.PI*2); ctx.fill();
            }
        });
    }

    function showResult() {
        const pace = Math.min(99, Math.round(((peakKmh - 15) / 23) * 57 + 40));
        document.getElementById('pace').innerText = pace;
        document.getElementById('kmh').innerText = peakKmh.toFixed(1) + " KM/H";
        document.getElementById('result').classList.remove('hidden');
    }

    init();
</script>
</body>
</html>
