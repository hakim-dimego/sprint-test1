<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SprintTrack Pro | Touch Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background: #000; color: #fff; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #viewport { position: relative; flex: 1; background: #000; overflow: hidden; }
        video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        /* Drag-Elemente */
        .draggable { position: absolute; z-index: 200; touch-action: none; display: flex; align-items: center; justify-content: center; }
        
        .line { top: 0; bottom: 0; width: 60px; transform: translateX(-50%); cursor: ew-resize; }
        .line-inner { width: 4px; height: 100%; }
        .line-start .line-inner { background: #00f5ff; box-shadow: 0 0 15px #00f5ff; }
        .line-end .line-inner { background: #ff3b30; box-shadow: 0 0 15px #ff3b30; }
        
        .person-focus { width: 100px; height: 100px; border: 3px dashed #fff; border-radius: 50%; background: rgba(255,255,255,0.1); transform: translate(-50%, -50%); cursor: move; }
        
        .label { position: absolute; top: 40px; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; pointer-events: none; }
    </style>
</head>
<body>

    <div class="p-4 bg-zinc-900 border-b border-white/10 flex justify-between items-center z-[300]">
        <h1 class="text-cyan-400 font-black italic uppercase text-xs">SprintTrack v7</h1>
        <div id="ai-status" class="text-[9px] font-bold text-red-500 uppercase">Warte auf Video...</div>
    </div>

    <div id="viewport">
        <video id="video" playsinline muted preload="auto"></video>
        <canvas id="canvas"></canvas>

        <div id="ui-start" class="draggable line line-start hidden" style="left: 20%">
            <div class="line-inner"></div>
            <span class="label" style="background:#00f5ff">START</span>
        </div>
        
        <div id="ui-end" class="draggable line line-end hidden" style="left: 80%">
            <div class="line-inner"></div>
            <span class="label" style="background:#ff3b30">ZIEL</span>
        </div>
        
        <div id="ui-person" class="draggable person-focus hidden" style="left: 50%; top: 50%"></div>
    </div>

    <div class="p-6 bg-zinc-900 border-t border-white/10 space-y-4 z-[300]">
        <div class="flex gap-3">
            <button onclick="document.getElementById('file-input').click()" class="flex-1 bg-white/10 py-4 rounded-xl text-[10px] font-bold uppercase">📁 Video laden</button>
            <input type="file" id="file-input" hidden accept="video/*" onchange="loadVideo(event)">
            <input type="number" id="dist" value="20" class="w-16 bg-zinc-800 rounded-xl text-center font-bold text-cyan-400 border border-white/10 outline-none">
        </div>
        <button id="btn-run" disabled onclick="run()" class="w-full py-5 bg-cyan-500 text-black font-black rounded-2xl uppercase tracking-widest disabled:opacity-20">Analyse Starten</button>
    </div>

<script>
    let detector, activeObj = null, analyzing = false;
    let config = { start: 20, end: 80 };
    let startT = null, endT = null;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function init() {
        detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, { modelType: 'thunder' });
        document.getElementById('ai-status').innerText = "Bereit zum Laden";
        
        // Event-Listener direkt an die Objekte binden
        const draggables = document.querySelectorAll('.draggable');
        draggables.forEach(el => {
            const startHandler = (e) => {
                if (analyzing) return;
                activeObj = el;
                el.style.scale = "1.1";
            };
            el.addEventListener('mousedown', startHandler);
            el.addEventListener('touchstart', startHandler, { passive: false });
        });

        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, { passive: false });
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);

        animate();
    }

    function loadVideo(e) {
        const file = e.target.files[0];
        if (!file) return;
        video.src = URL.createObjectURL(file);
        video.onloadeddata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            document.querySelectorAll('.hidden').forEach(el => el.classList.remove('hidden'));
            document.getElementById('btn-run').disabled = false;
            document.getElementById('ai-status').innerText = "Marker setzen";
            document.getElementById('ai-status').className = "text-[9px] font-bold text-cyan-400 uppercase";
        };
    }

    function move(e) {
        if (!activeObj) return;
        if (e.cancelable) e.preventDefault();

        const rect = document.getElementById('viewport').getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const xP = ((clientX - rect.left) / rect.width) * 100;
        const yP = ((clientY - rect.top) / rect.height) * 100;

        if (xP >= 0 && xP <= 100) {
            activeObj.style.left = xP + '%';
            if (activeObj.id === 'ui-start') config.start = xP;
            if (activeObj.id === 'ui-end') config.end = xP;
        }
        if (activeObj.id === 'ui-person' && yP >= 0 && yP <= 100) {
            activeObj.style.top = yP + '%';
        }
    }

    function end() { 
        if (activeObj) activeObj.style.scale = "1";
        activeObj = null; 
    }

    function run() {
        analyzing = true; startT = null; endT = null;
        video.currentTime = 0;
        document.getElementById('ui-person').style.display = "none";
        video.play();
    }

    async function animate() {
        if (video.readyState >= 2) {
            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (poses && poses[0] && poses[0].keypoints[11].score > 0.3) {
                const p = poses[0].keypoints;
                const hX = (p[11].x + p[12].x) / 2;
                const hY = (p[11].y + p[12].y) / 2;
                const hRel = (hX / canvas.width) * 100;

                ctx.fillStyle = "#00f5ff";
                ctx.beginPath(); ctx.arc(hX, hY, 15, 0, 7); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();

                if (analyzing) {
                    const dir = config.end > config.start ? 1 : -1;
                    if (!startT && (dir === 1 ? hRel >= config.start : hRel <= config.start)) startT = video.currentTime;
                    if (startT && !endT && (dir === 1 ? hRel >= config.end : hRel <= config.end)) {
                        endT = video.currentTime;
                        analyzing = false;
                        video.pause();
                        const time = endT - startT;
                        const kmh = (parseFloat(document.getElementById('dist').value) / time) * 3.6;
                        alert(`ERGEBNIS:\n${time.toFixed(2)}s | ${kmh.toFixed(1)} km/h`);
                        document.getElementById('ui-person').style.display = "flex";
                    }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    init();
</script>
</body>
</html>
