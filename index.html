<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SprintTrack Pro | FC 26 Edition</title>
    
    <!-- CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            background-color: #05050A;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100dvh;
        }

        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #viewport {
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neon-text {
            color: #00F5FF;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        .btn-active:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Kamera & Analysis Layer -->
    <div id="viewport" class="relative flex-1 overflow-hidden">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="canvas"></canvas>
        
        <!-- UI Top: Status & Home -->
        <div class="absolute top-10 inset-x-0 px-6 flex justify-between items-start z-50">
            <div class="glass rounded-2xl p-3 flex flex-col">
                <span class="text-[10px] font-black uppercase tracking-widest opacity-50">SprintTrack</span>
                <span id="status-text" class="text-xs font-bold text-cyan-400 uppercase">Initialisiere...</span>
            </div>
            
            <button onclick="restartApp()" class="glass rounded-full w-12 h-12 flex items-center justify-center text-xl btn-active">
                🔄
            </button>
        </div>

        <!-- Speed HUD -->
        <div id="speed-bubble" class="hidden absolute top-32 right-6 glass rounded-2xl p-3 flex flex-col text-right z-50">
            <span id="live-speed" class="text-4xl font-black italic">0.0</span>
            <span class="text-[8px] font-bold uppercase tracking-widest opacity-50">KM/H</span>
        </div>

        <!-- Timer Overlay -->
        <div id="timer-overlay" class="hidden absolute inset-0 flex items-center justify-center bg-black/40 z-[60] pointer-events-none">
            <div id="timer-val" class="text-9xl font-black italic neon-text">3</div>
        </div>
    </div>

    <!-- Controls Bottom -->
    <div id="controls" class="glass w-full p-6 pb-10 flex flex-col gap-4 z-50">
        <div id="setup-controls" class="flex flex-col gap-4">
            <div class="flex gap-2">
                <button onclick="document.getElementById('file-input').click()" class="flex-1 py-3 bg-white/10 rounded-xl text-xs font-bold uppercase tracking-widest border border-cyan-400/20 btn-active">
                    📁 Video laden
                </button>
                <button onclick="resetCalibration()" class="flex-1 py-3 bg-white/5 rounded-xl text-xs font-bold uppercase tracking-widest border border-white/10 btn-active">
                    Reset
                </button>
            </div>
            <button id="start-btn" onclick="startSprint()" class="w-full py-5 bg-cyan-500 rounded-2xl text-black font-black text-lg uppercase tracking-[4px] shadow-[0_0_30px_rgba(0,245,255,0.4)] btn-active transition-all">
                Analyse Starten
            </button>
            <input type="file" id="file-input" hidden accept="video/*" onchange="handleFileUpload(event)">
        </div>
    </div>

    <!-- FIFA RESULT CARD -->
    <div id="result-overlay" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-2xl flex flex-col items-center justify-center p-6">
        <div id="fc-card" class="relative w-72 h-[420px] rounded-[2.5rem] p-1 overflow-hidden transition-all duration-700 scale-50 opacity-0 shadow-[0_0_50px_rgba(255,215,0,0.2)]">
            <div id="card-bg" class="absolute inset-0 bg-gradient-to-br from-amber-200 via-yellow-400 to-amber-600"></div>
            
            <div class="relative h-full w-full flex flex-col items-center text-slate-900 italic font-black uppercase pt-8">
                <div class="flex flex-col items-center">
                    <span id="card-pace" class="text-7xl leading-none">0</span>
                    <span class="text-xl tracking-tighter -mt-1">PAC</span>
                </div>
                
                <div class="w-44 h-44 bg-black/10 rounded-full mt-2 flex items-center justify-center overflow-hidden border-4 border-black/5">
                    <span class="text-8xl mt-4 opacity-40">👤</span>
                </div>

                <div class="text-3xl tracking-tighter mt-2 border-b-2 border-slate-900/20 w-4/5 text-center pb-1">DU</div>
                
                <div class="grid grid-cols-2 gap-x-6 gap-y-1 text-[11px] mt-4 w-3/4">
                    <div class="flex justify-between border-b border-slate-900/10"><span>KMH</span><span id="res-kmh">0.0</span></div>
                    <div class="flex justify-between border-b border-slate-900/10"><span>ACC</span><span>92</span></div>
                    <div class="flex justify-between border-b border-slate-900/10"><span>STA</span><span>85</span></div>
                    <div class="flex justify-between border-b border-slate-900/10"><span>DRI</span><span>78</span></div>
                </div>

                <div class="mt-auto mb-6 flex flex-col items-center opacity-60">
                    <span class="text-[8px] tracking-widest mb-1">Vergleich</span>
                    <span id="star-name" class="text-xs bg-black/10 px-4 py-1 rounded-full">-</span>
                </div>
            </div>
            <div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/30 to-white/0 pointer-events-none"></div>
        </div>

        <button onclick="closeResult()" class="mt-10 py-4 px-12 bg-white/10 hover:bg-white/20 text-white rounded-full font-black uppercase tracking-widest transition-all">Schließen</button>
    </div>
</div>

<script>
    const state = {
        detector: null,
        isMeasuring: false,
        calPoints: [],
        pxm: 0,
        realDistance: 20,
        peakKmh: 0,
        lastPos: null,
        lastTime: null,
        activeLoop: true
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function initApp() {
        try {
            updateStatus('Lade AI...');
            await tf.setBackend('webgl');
            await tf.ready();
            
            state.detector = await poseDetection.createDetector(
                poseDetection.SupportedModels.BlazePose, 
                { runtime: 'tfjs', modelType: 'lite' }
            );
            
            await startCamera();
            updateStatus('Punkte setzen');
            render();
        } catch (err) {
            updateStatus('Fehler: Kamera blockiert');
        }
    }

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        video.srcObject = stream;
        return new Promise(resolve => video.onloadedmetadata = () => {
            syncCanvas();
            resolve();
        });
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (file) {
            updateStatus('Video lädt...');
            const url = URL.createObjectURL(file);
            video.srcObject = null;
            video.src = url;
            video.muted = true;
            video.loop = true;
            video.play();
            video.onloadedmetadata = () => {
                syncCanvas();
                updateStatus('Punkte setzen');
            };
        }
    }

    function syncCanvas() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
    }

    function render() {
        if (!state.activeLoop) return;
        
        if (video.readyState >= 2) {
            state.detector.estimatePoses(video).then(poses => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawCalibrationMarkers();

                if (poses && poses[0]) {
                    const pose = poses[0];
                    drawKeypoints(pose);
                    if (state.isMeasuring) processMotion(pose);
                }
            });
        }
        requestAnimationFrame(render);
    }

    function drawKeypoints(pose) {
        ctx.fillStyle = '#00F5FF';
        // Hüfte und Schultern
        [11, 12, 23, 24].forEach(i => {
            const kp = pose.keypoints[i];
            if (kp.score > 0.5) {
                ctx.beginPath();
                ctx.arc(kp.x, kp.y, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });
    }

    function processMotion(pose) {
        const hipL = pose.keypoints[23], hipR = pose.keypoints[24];
        if (hipL.score < 0.5 || hipR.score < 0.5) return;

        const cx = (hipL.x + hipR.x) / 2;
        const cy = (hipL.y + hipR.y) / 2;
        const now = performance.now();

        if (state.lastPos && state.lastTime) {
            const dt = (now - state.lastTime) / 1000;
            const dx = Math.hypot(cx - state.lastPos.x, cy - state.lastPos.y);
            
            if (state.pxm > 0 && dt > 0) {
                const meters = dx / state.pxm;
                const kmh = (meters / dt) * 3.6;
                if (kmh < 60) { // Plausibilitäts-Check
                    state.peakKmh = Math.max(state.peakKmh, kmh);
                    document.getElementById('live-speed').innerText = kmh.toFixed(1);
                }
            }
        }
        state.lastPos = { x: cx, y: cy };
        state.lastTime = now;
    }

    function drawCalibrationMarkers() {
        state.calPoints.forEach((p, i) => {
            ctx.fillStyle = i === 0 ? '#FF3B30' : '#00F5FF';
            ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 4; ctx.stroke();
        });
        if (state.calPoints.length === 2) {
            ctx.beginPath();
            ctx.setLineDash([15, 15]);
            ctx.moveTo(state.calPoints[0].x, state.calPoints[0].y);
            ctx.lineTo(state.calPoints[1].x, state.calPoints[1].y);
            ctx.strokeStyle = "rgba(255,255,255,0.5)";
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        if (state.isMeasuring) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        if (state.calPoints.length < 2) {
            state.calPoints.push({ x, y });
            if (state.calPoints.length === 2) {
                const d = Math.hypot(state.calPoints[1].x - state.calPoints[0].x, state.calPoints[1].y - state.calPoints[0].y);
                state.pxm = d / state.realDistance;
                updateStatus('Bereit für Sprint');
            }
        }
    });

    function resetCalibration() {
        state.calPoints = [];
        state.pxm = 0;
        updateStatus('Punkte setzen');
    }

    function startSprint() {
        if (state.calPoints.length < 2) return alert("Punkte setzen!");
        document.getElementById('timer-overlay').classList.remove('hidden');
        let c = 3;
        const iv = setInterval(() => {
            c--;
            if (c > 0) document.getElementById('timer-val').innerText = c;
            else {
                clearInterval(iv);
                document.getElementById('timer-val').innerText = "GO!";
                setTimeout(() => {
                    document.getElementById('timer-overlay').classList.add('hidden');
                    state.isMeasuring = true;
                    state.peakKmh = 0;
                    document.getElementById('speed-bubble').classList.remove('hidden');
                    updateStatus('Analyse läuft...');
                    setTimeout(stopSprint, 4000);
                }, 500);
            }
        }, 1000);
    }

    function stopSprint() {
        state.isMeasuring = false;
        document.getElementById('speed-bubble').classList.add('hidden');
        updateStatus('Abgeschlossen');
        showResult();
    }

    function showResult() {
        const speed = state.peakKmh;
        const pace = Math.min(99, Math.max(10, Math.round(((speed - 15) / (38 - 15)) * 57 + 40)));
        
        document.getElementById('card-pace').innerText = pace;
        document.getElementById('res-kmh').innerText = speed.toFixed(1);
        
        const cardBg = document.getElementById('card-bg');
        const star = document.getElementById('star-name');

        if (speed > 30) {
            cardBg.className = "absolute inset-0 bg-gradient-to-br from-amber-200 via-yellow-400 to-amber-600";
            star.innerText = "Alphonso Davies";
        } else if (speed > 22) {
            cardBg.className = "absolute inset-0 bg-gradient-to-br from-slate-200 via-gray-400 to-slate-500";
            star.innerText = "Kyle Walker";
        } else {
            cardBg.className = "absolute inset-0 bg-gradient-to-br from-orange-400 via-orange-300 to-orange-700";
            star.innerText = "Harry Kane";
        }

        document.getElementById('result-overlay').classList.remove('hidden');
        const card = document.getElementById('fc-card');
        setTimeout(() => { card.style.transform = "scale(1)"; card.style.opacity = "1"; }, 100);
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    function restartApp() {
        location.reload();
    }

    function closeResult() {
        document.getElementById('result-overlay').classList.add('hidden');
        restartApp();
    }

    function updateStatus(t) { document.getElementById('status-text').innerText = t; }

    initApp();
</script>
</body>
</html>
