<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SprintTrack | Track-Lock Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100dvh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .marker-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #00F5FF; z-index: 60; pointer-events: none; }
        .person-marker { position: absolute; width: 40px; height: 40px; border: 3px solid #FF3B30; border-radius: 50%; transform: translate(-50%, -50%); z-index: 70; pointer-events: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } 100% { transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>

<div class="relative w-full h-full flex flex-col">
    <div id="video-container" class="relative flex-1 bg-black cursor-crosshair" onclick="handleClick(event)">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        
        <div id="line-start" class="marker-line hidden"></div>
        <div id="line-end" class="marker-line hidden"></div>
        <div id="person-point" class="person-marker hidden"></div>

        <div id="msg-box" class="absolute top-10 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-2xl text-center z-[100] border border-cyan-400/30">
            <p id="msg-text" class="text-xs font-black uppercase tracking-widest text-cyan-400">Video wählen</p>
        </div>
    </div>

    <div class="glass p-6 flex flex-col gap-4 z-50">
        <div class="flex gap-4">
            <button onclick="document.getElementById('file-input').click()" class="flex-1 py-4 bg-white/10 rounded-xl font-bold text-xs uppercase">📁 Video</button>
            <input type="file" id="file-input" hidden accept="video/*" onchange="handleFile(event)">
            <input type="number" id="dist-input" value="20" class="w-20 bg-white/5 border border-white/20 rounded-xl text-center font-bold">
        </div>
        <button id="run-btn" onclick="startAnalysis()" class="w-full py-5 bg-cyan-500 text-black font-black rounded-2xl uppercase tracking-widest opacity-30" disabled>Analyse</button>
    </div>
</div>

<script>
    let detector, markers = { start: null, end: null, person: null };
    let startT = null, endT = null, active = false;
    const video = document.getElementById('video'), canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

    async function init() {
        detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, { modelType: 'thunder' });
        updateMsg("Video laden...");
        loop();
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                updateMsg("Klick auf Start-Hütchen");
            };
        }
    }

    function handleClick(e) {
        if (!video.src) return;
        const rect = video.getBoundingClientRect();
        const xRel = ((e.clientX - rect.left) / rect.width) * 100;
        const yRel = ((e.clientY - rect.top) / rect.height) * 100;

        if (!markers.start) {
            markers.start = xRel;
            showMarker('line-start', xRel);
            updateMsg("Klick auf Ziel-Hütchen");
        } else if (!markers.end) {
            markers.end = xRel;
            showMarker('line-end', xRel);
            updateMsg("Klick auf die Person");
        } else if (!markers.person) {
            markers.person = { x: xRel, y: yRel };
            const p = document.getElementById('person-point');
            p.style.left = xRel + "%"; p.style.top = yRel + "%";
            p.classList.remove('hidden');
            updateMsg("Bereit!");
            document.getElementById('run-btn').disabled = false;
            document.getElementById('run-btn').classList.remove('opacity-30');
        }
    }

    function showMarker(id, x) {
        const el = document.getElementById(id);
        el.style.left = x + "%"; el.classList.remove('hidden');
    }

    function updateMsg(t) { document.getElementById('msg-text').innerText = t; }

    function startAnalysis() {
        video.currentTime = 0; startT = null; endT = null; active = true;
        document.getElementById('person-point').classList.add('hidden');
        video.play();
    }

    async function loop() {
        if (video.readyState >= 2) {
            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (poses[0]) {
                const hip = (poses[0].keypoints[11].x + poses[0].keypoints[12].x) / 2;
                const hipY = (poses[0].keypoints[11].y + poses[0].keypoints[12].y) / 2;
                const hipRel = (hip / canvas.width) * 100;
                
                // Track-Visualisierung
                ctx.fillStyle = "#00F5FF"; ctx.beginPath(); ctx.arc(hip, hipY, 8, 0, 7); ctx.fill();

                if (active) {
                    const dir = markers.end > markers.start ? 1 : -1;
                    if (!startT && (dir === 1 ? hipRel >= markers.start : hipRel <= markers.start)) startT = video.currentTime;
                    if (startT && !endT && (dir === 1 ? hipRel >= markers.end : hipRel <= markers.end)) {
                        endT = video.currentTime; active = false; video.pause();
                        const time = endT - startT;
                        const d = parseFloat(document.getElementById('dist-input').value);
                        alert(`ERGEBNIS\nZeit: ${time.toFixed(2)}s\nSpeed: ${(d/time*3.6).toFixed(1)} km/h`);
                    }
                }
            }
        }
        requestAnimationFrame(loop);
    }
    init();
</script>
</body>
</html>
