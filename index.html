<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SprintTimer | Precision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        video { width: 100%; max-height: 60dvh; background: #111; object-fit: contain; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-top: 1px solid rgba(255, 255, 255, 0.1); }
        input[type=range] { width: 100%; height: 8px; border-radius: 5px; background: #333; accent-color: #00f5ff; }
    </style>
</head>
<body>

    <div class="p-4 flex justify-between items-center border-b border-white/10">
        <h1 class="text-cyan-400 font-black italic uppercase tracking-tighter">SprintTimer v1.0</h1>
        <div id="result" class="text-xl font-bold text-white">0.00s</div>
    </div>

    <div class="relative flex-1 flex flex-col items-center justify-center">
        <video id="video" playsinline></video>
        
        <div class="w-full p-4 space-y-4">
            <input type="range" id="seeker" value="0" step="0.001" oninput="seekVideo()">
            <div class="flex justify-between text-[10px] font-bold opacity-50 uppercase tracking-widest">
                <span>Anfang</span>
                <span id="currentTimeDisplay">0:00</span>
                <span>Ende</span>
            </div>
        </div>
    </div>

    <div class="glass p-6 pb-10 space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <button onclick="setMarker('start')" class="bg-cyan-500/20 border border-cyan-500 text-cyan-400 py-4 rounded-2xl font-black uppercase text-xs">
                Start setzen
                <div id="startDisplay" class="text-[9px] opacity-60">--:--</div>
            </button>
            <button onclick="setMarker('end')" class="bg-red-500/20 border border-red-500 text-red-400 py-4 rounded-2xl font-black uppercase text-xs">
                Ziel setzen
                <div id="endDisplay" class="text-[9px] opacity-60">--:--</div>
            </button>
        </div>

        <div class="flex gap-4">
            <button onclick="document.getElementById('file').click()" class="flex-1 bg-white/5 py-4 rounded-xl text-[10px] font-bold uppercase border border-white/10">📁 Video laden</button>
            <input type="file" id="file" hidden accept="video/*" onchange="loadVideo(event)">
            
            <div class="w-24 bg-white/5 rounded-xl border border-white/10 flex flex-col items-center justify-center">
                <span class="text-[8px] opacity-50 font-bold uppercase">Distanz</span>
                <input type="number" id="dist" value="20" class="bg-transparent text-center font-bold text-cyan-400 w-full outline-none">
            </div>
        </div>

        <button onclick="calculate()" class="w-full py-5 bg-white text-black font-black rounded-2xl uppercase tracking-[2px] shadow-xl">Zeit berechnen</button>
    </div>

<script>
    const video = document.getElementById('video');
    const seeker = document.getElementById('seeker');
    let startTime = null;
    let endTime = null;

    function loadVideo(e) {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                seeker.max = video.duration;
                document.getElementById('currentTimeDisplay').innerText = "Bereit";
            };
        }
    }

    function seekVideo() {
        video.currentTime = seeker.value;
        document.getElementById('currentTimeDisplay').innerText = video.currentTime.toFixed(3) + "s";
    }

    function setMarker(type) {
        if (type === 'start') {
            startTime = video.currentTime;
            document.getElementById('startDisplay').innerText = startTime.toFixed(3) + "s";
        } else {
            endTime = video.currentTime;
            document.getElementById('endDisplay').innerText = endTime.toFixed(3) + "s";
        }
    }

    function calculate() {
        if (startTime === null || endTime === null) {
            alert("Bitte erst Start- und Zielpunkt markieren!");
            return;
        }

        const diff = Math.abs(endTime - startTime);
        const distance = parseFloat(document.getElementById('dist').value);
        const kmh = (distance / diff) * 3.6;

        document.getElementById('result').innerText = diff.toFixed(2) + "s";
        
        alert(`MESSUNG ERFOLGREICH:\n\nZeit: ${diff.toFixed(3)}s\nGeschwindigkeit: ${kmh.toFixed(1)} km/h`);
    }

    // Erlaubt feines Spulen mit Pfeiltasten am PC
    window.addEventListener('keydown', (e) => {
        if (e.key === "ArrowLeft") video.currentTime -= 0.033; // ~1 Frame
        if (e.key === "ArrowRight") video.currentTime += 0.033;
        seeker.value = video.currentTime;
    });
</script>
</body>
</html>
