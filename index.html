<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SprintTrack Pro | Editable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100dvh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        
        /* Draggable Lines */
        .marker-line { position: absolute; top: 0; bottom: 0; width: 4px; z-index: 60; cursor: ew-resize; display: flex; align-items: center; justify-content: center; }
        .line-start { background: #00F5FF; box-shadow: 0 0 15px #00F5FF; }
        .line-end { background: #FF3B30; box-shadow: 0 0 15px #FF3B30; }
        .handle { width: 30px; height: 60px; background: inherit; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #000; }
        
        .person-handle { position: absolute; width: 50px; height: 50px; border: 3px dashed #fff; border-radius: 50%; z-index: 70; cursor: move; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

<div class="relative w-full h-full flex flex-col">
    <div id="container" class="relative flex-1 bg-black overflow-hidden" onmousedown="startDrag(event)" ontouchstart="startDrag(event)" onmousemove="doDrag(event)" ontouchmove="doDrag(event)" onmouseup="stopDrag()" ontouchend="stopDrag()">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        
        <div id="m-start" class="marker-line line-start hidden" style="left: 20%"><div class="handle">START</div></div>
        <div id="m-end" class="marker-line line-end hidden" style="left: 80%"><div class="handle">ZIEL</div></div>
        <div id="m-person" class="person-handle hidden" style="left: 50%; top: 50%"></div>

        <div id="hud" class="absolute top-6 left-1/2 -translate-x-1/2 glass px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest text-cyan-400 z-[100]">Video laden</div>
    </div>

    <div class="glass p-6 flex flex-col gap-4 z-[110]">
        <div class="flex gap-4">
            <button onclick="document.getElementById('file-input').click()" class="flex-1 py-4 bg-white/10 rounded-xl font-bold text-[10px] uppercase">📁 Video wählen</button>
            <input type="file" id="file-input" hidden accept="video/*" onchange="handleFile(event)">
            <div class="flex items-center bg-white/5 rounded-xl px-4 border border-white/10">
                <span class="text-[10px] font-bold opacity-50 mr-2">DISTANZ:</span>
                <input type="number" id="dist" value="20" class="w-12 bg-transparent font-bold text-cyan-400 outline-none">
            </div>
        </div>
        <button id="run-btn" onclick="runAnalysis()" class="w-full py-5 bg-cyan-500 text-black font-black rounded-2xl uppercase tracking-[3px] opacity-30" disabled>Analyse Starten</button>
    </div>
</div>

<script>
    let detector, activeDrag = null, markers = { start: 20, end: 80, person: {x: 50, y: 50} };
    let startT = null, endT = null, isPlaying = false;
    const video = document.getElementById('video'), canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

    async function init() {
        detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, { modelType: 'thunder' });
        loop();
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                document.querySelectorAll('.marker-line, .person-handle').forEach(el => el.classList.remove('hidden'));
                document.getElementById('run-btn').disabled = false;
                document.getElementById('run-btn').classList.remove('opacity-30');
                document.getElementById('hud').innerText = "Linien & Person ausrichten";
            };
        }
    }

    // DRAG & DROP LOGIC
    function startDrag(e) {
        const target = e.target.closest('.marker-line, .person-handle');
        if (target) activeDrag = target.id;
    }

    function doDrag(e) {
        if (!activeDrag) return;
        const rect = document.getElementById('container').getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const x = ((clientX - rect.left) / rect.width) * 100;
        const y = ((clientY - rect.top) / rect.height) * 100;

        if (activeDrag === 'm-start') { markers.start = x; document.getElementById('m-start').style.left = x + '%'; }
        if (activeDrag === 'm-end') { markers.end = x; document.getElementById('m-end').style.left = x + '%'; }
        if (activeDrag === 'm-person') { 
            markers.person = {x, y}; 
            document.getElementById('m-person').style.left = x + '%'; 
            document.getElementById('m-person').style.top = y + '%'; 
        }
    }

    function stopDrag() { activeDrag = null; }

    function runAnalysis() {
        video.currentTime = 0; startT = null; endT = null; isPlaying = true;
        document.getElementById('hud').innerText = "Analysiere...";
        video.play();
    }

    async function loop() {
        if (video.readyState >= 2) {
            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (poses[0]) {
                const hip = (poses[0].keypoints[11].x + poses[0].keypoints[12].x) / 2;
                const hipRel = (hip / canvas.width) * 100;
                
                // Visualisierung der KI-Hüfte
                ctx.fillStyle = "#00F5FF"; ctx.beginPath(); ctx.arc(hip, (poses[0].keypoints[11].y + poses[0].keypoints[12].y)/2, 8, 0, 7); ctx.fill();

                if (isPlaying) {
                    const dir = markers.end > markers.start ? 1 : -1;
                    // START
                    if (!startT && (dir === 1 ? hipRel >= markers.start : hipRel <= markers.start)) {
                        startT = video.currentTime;
                    }
                    // ZIEL (ABBRUCH-LOGIK)
                    if (startT && !endT && (dir === 1 ? hipRel >= markers.end : hipRel <= markers.end)) {
                        endT = video.currentTime;
                        isPlaying = false;
                        video.pause();
                        const time = endT - startT;
                        const speed = (parseFloat(document.getElementById('dist').value) / time) * 3.6;
                        document.getElementById('hud').innerText = "Abgeschlossen";
                        alert(`ERGEBNIS:\nZeit: ${time.toFixed(2)}s\nDurchschnitt: ${speed.toFixed(1)} km/h`);
                    }
                }
            }
        }
        requestAnimationFrame(loop);
    }
    init();
</script>
</body>
</html>
