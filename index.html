<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SprintTrack Pro | Drag-Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background: #000; color: #fff; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #viewport { position: relative; flex: 1; background: #000; touch-action: none; }
        video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        /* Draggable UI */
        .drag-layer { position: absolute; inset: 0; z-index: 100; }
        
        .line { position: absolute; top: 0; bottom: 0; width: 20px; transform: translateX(-50%); cursor: ew-resize; display: flex; align-items: center; justify-content: center; }
        .line::after { content: ''; width: 4px; height: 100%; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .line-start::after { background: #00f5ff; box-shadow: 0 0 15px #00f5ff; }
        .line-end::after { background: #ff3b30; box-shadow: 0 0 15px #ff3b30; }
        
        .handle-label { position: absolute; top: 40px; background: inherit; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; }

        .person-focus { 
            position: absolute; 
            width: 80px; 
            height: 80px; 
            border: 3px dashed #fff; 
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            cursor: move; 
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
        }
        .person-focus::before { content: 'PERSON'; font-size: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="p-4 bg-zinc-900 border-b border-white/10 flex justify-between items-center z-[110]">
        <h1 class="text-cyan-400 font-black italic uppercase">SprintTrack v5</h1>
        <div id="status-pill" class="bg-white/5 px-3 py-1 rounded-full text-[9px] font-bold uppercase text-white/50 border border-white/10">Warte...</div>
    </div>

    <div id="viewport">
        <video id="video" playsinline muted preload="auto"></video>
        <canvas id="canvas"></canvas>

        <div class="drag-layer" onmousedown="startDrag(event)" ontouchstart="startDrag(event)">
            <div id="ui-start" class="line line-start hidden" style="left: 20%"><span class="handle-label" style="background:#00f5ff">START</span></div>
            <div id="ui-end" class="line line-end hidden" style="left: 80%"><span class="handle-label" style="background:#ff3b30">ZIEL</span></div>
            <div id="ui-person" class="person-focus hidden" style="left: 50%; top: 50%"></div>
        </div>
    </div>

    <div class="p-6 bg-zinc-900 border-t border-white/10 space-y-4 z-[110]">
        <div class="flex gap-3">
            <button onclick="document.getElementById('file-input').click()" class="flex-1 bg-white/10 py-4 rounded-xl text-[10px] font-bold uppercase">📁 Video laden</button>
            <input type="file" id="file-input" hidden accept="video/*" onchange="loadVideo(event)">
            <input type="number" id="dist" value="20" class="w-16 bg-white/5 border border-white/10 rounded-xl text-center font-bold text-cyan-400">
        </div>
        <button id="btn-run" disabled onclick="runAnalysis()" class="w-full py-5 bg-cyan-500 text-black font-black rounded-2xl uppercase tracking-[3px] disabled:opacity-20">Analyse Starten</button>
    </div>

<script>
    let detector, activeObj = null, analyzing = false;
    let config = { start: 20, end: 80 };
    let startT = null, endT = null;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function init() {
        detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, { modelType: 'thunder' });
        document.getElementById('status-pill').innerText = "Bereit";
        
        // Window-Events für flüssiges Dragging
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('touchmove', moveDrag, { passive: false });
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
        
        animate();
    }

    function loadVideo(e) {
        const file = e.target.files[0];
        if (!file) return;
        video.src = URL.createObjectURL(file);
        video.onloadeddata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            document.querySelectorAll('.hidden').forEach(el => el.classList.remove('hidden'));
            document.getElementById('btn-run').disabled = false;
            document.getElementById('status-pill').innerText = "Marker setzen";
        };
    }

    function startDrag(e) {
        const target = e.target.closest('.line, .person-focus');
        if (target) {
            activeObj = target;
            e.preventDefault();
        }
    }

    function moveDrag(e) {
        if (!activeObj) return;
        const rect = document.getElementById('viewport').getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const xP = ((clientX - rect.left) / rect.width) * 100;
        const yP = ((clientY - rect.top) / rect.height) * 100;

        if (xP >= 0 && xP <= 100) {
            activeObj.style.left = xP + '%';
            if (activeObj.id === 'ui-start') config.start = xP;
            if (activeObj.id === 'ui-end') config.end = xP;
        }
        if (activeObj.id === 'ui-person' && yP >= 0 && yP <= 100) {
            activeObj.style.top = yP + '%';
        }
        if(e.touches) e.preventDefault();
    }

    function endDrag() { activeObj = null; }

    async function runAnalysis() {
        analyzing = true; startT = null; endT = null;
        video.currentTime = 0;
        document.getElementById('ui-person').style.opacity = "0";
        document.getElementById('status-pill').innerText = "Scanning...";
        video.play();
    }

    async function animate() {
        if (video.readyState >= 2) {
            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (poses && poses[0]) {
                const p = poses[0].keypoints;
                const hipX = (p[11].x + p[12].x) / 2;
                const hipY = (p[11].y + p[12].y) / 2;
                const hipRel = (hipX / canvas.width) * 100;

                // KI-Tracker Zeichnen
                ctx.fillStyle = "#00f5ff";
                ctx.beginPath(); ctx.arc(hipX, hipY, 12, 0, 7); ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();

                if (analyzing) {
                    const dir = config.end > config.start ? 1 : -1;
                    if (!startT && (dir === 1 ? hipRel >= config.start : hipRel <= config.start)) {
                        startT = video.currentTime;
                        document.getElementById('status-pill').innerText = "Running";
                    }
                    if (startT && !endT && (dir === 1 ? hipRel >= config.end : hipRel <= config.end)) {
                        endT = video.currentTime;
                        analyzing = false;
                        video.pause();
                        const time = endT - startT;
                        const kmh = (parseFloat(document.getElementById('dist').value) / time) * 3.6;
                        alert(`ERGEBNIS:\nZeit: ${time.toFixed(2)}s\nSpeed: ${kmh.toFixed(1)} km/h`);
                        document.getElementById('ui-person').style.opacity = "1";
                    }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    init();
</script>
</body>
</html>
