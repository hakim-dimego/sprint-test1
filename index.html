<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SprintTrack | Precision Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body { background: #05050A; color: #fff; font-family: sans-serif; overflow: hidden; height: 100dvh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .marker-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #00F5FF; box-shadow: 0 0 10px #00F5FF; z-index: 60; pointer-events: none; }
        .marker-label { position: absolute; top: 10px; transform: translateX(-50%); background: #00F5FF; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="setup-screen" class="fixed inset-0 z-[200] bg-black flex items-center justify-center p-6">
    <div class="glass p-8 rounded-[2.5rem] w-full max-w-md border border-cyan-400/30">
        <h1 class="text-2xl font-black text-cyan-400 italic mb-6 text-center uppercase">Sprint Setup</h1>
        
        <div class="space-y-6">
            <div>
                <label class="text-[10px] uppercase opacity-50 font-bold block mb-2 tracking-widest">Streckenlänge (Hütchen-Abstand)</label>
                <select id="sprint-dist" class="w-full bg-white/10 border border-white/20 rounded-2xl py-4 px-4 text-white font-bold outline-none">
                    <option value="10">10 Meter</option>
                    <option value="20" selected>20 Meter</option>
                    <option value="30">30 Meter</option>
                </select>
            </div>

            <div>
                <label class="text-[10px] uppercase opacity-50 font-bold block mb-2 tracking-widest">Deine Körpergröße (m)</label>
                <input type="number" id="user-height" value="1.80" step="0.01" class="w-full bg-white/10 border border-white/20 rounded-2xl py-4 px-4 text-cyan-400 font-bold text-xl outline-none">
            </div>

            <button onclick="closeSetup()" class="w-full py-5 bg-cyan-500 rounded-3xl text-black font-black text-lg uppercase tracking-widest">Weiter zum Video</button>
        </div>
    </div>
</div>

<div class="relative w-full h-full flex flex-col">
    <div id="video-container" class="relative flex-1 bg-black overflow-hidden cursor-crosshair" onclick="placeMarker(event)">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        
        <div id="line-start" class="marker-line hidden"><span class="marker-label">START (0m)</span></div>
        <div id="line-end" class="marker-line hidden"><span class="marker-label">ZIEL</span></div>

        <div id="instruction-overlay" class="absolute inset-0 flex items-center justify-center bg-black/40 pointer-events-none z-50">
            <p id="instruction-text" class="glass px-6 py-3 rounded-full text-sm font-bold border border-white/20 uppercase tracking-widest text-center">Video laden...</p>
        </div>
    </div>

    <div class="glass p-6 pb-10 flex flex-col gap-4 z-50">
        <div class="flex gap-4">
            <button onclick="document.getElementById('file-input').click()" class="flex-1 py-4 bg-white/5 border border-white/10 rounded-2xl text-[10px] font-bold uppercase">📁 Video wählen</button>
            <input type="file" id="file-input" hidden accept="video/*" onchange="handleFile(event)">
            <button id="reset-btn" onclick="resetMarkers()" class="px-6 bg-red-500/20 border border-red-500/50 rounded-2xl text-[10px] font-bold uppercase">Reset</button>
        </div>
        <button id="master-btn" onclick="startAnalysis()" class="w-full py-5 bg-cyan-500 rounded-3xl text-black font-black text-lg uppercase tracking-widest opacity-50 cursor-not-allowed" disabled>Bereitstellen...</button>
    </div>
</div>

<script>
    let detector, isRunning = false, markers = [];
    let startFrameTime = null, endFrameTime = null;
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function init() {
        detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet);
        document.getElementById('instruction-text').innerText = "1. Video wählen";
        loop();
    }

    function closeSetup() { document.getElementById('setup-screen').style.display = 'none'; }

    function handleFile(e) {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                resetMarkers();
                document.getElementById('instruction-text').innerText = "Klicke auf das Start-Hütchen (0m)";
            };
        }
    }

    function placeMarker(e) {
        if (!video.src || markers.length >= 2) return;
        
        const rect = video.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        
        if (markers.length === 0) {
            markers.push(x);
            const line = document.getElementById('line-start');
            line.style.left = x + "%";
            line.classList.remove('hidden');
            document.getElementById('instruction-text').innerText = "Klicke auf das Ziel-Hütchen";
        } else {
            markers.push(x);
            const line = document.getElementById('line-end');
            line.style.left = x + "%";
            line.classList.remove('hidden');
            document.getElementById('line-end').querySelector('.marker-label').innerText = "ZIEL (" + document.getElementById('sprint-dist').value + "m)";
            document.getElementById('instruction-text').innerText = "Bereit zum Messen!";
            document.getElementById('master-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('master-btn').disabled = false;
        }
    }

    function resetMarkers() {
        markers = [];
        document.getElementById('line-start').classList.add('hidden');
        document.getElementById('line-end').classList.add('hidden');
        document.getElementById('master-btn').disabled = true;
        document.getElementById('master-btn').classList.add('opacity-50');
        startFrameTime = null; endFrameTime = null;
    }

    function startAnalysis() {
        video.currentTime = 0;
        isRunning = true;
        document.getElementById('instruction-overlay').classList.add('hidden');
        video.play();
    }

    async function loop() {
        if (video.readyState >= 2) {
            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (poses[0]) {
                const pose = poses[0];
                draw(pose);
                if (isRunning) checkLines(pose);
            }
        }
        requestAnimationFrame(loop);
    }

    function checkLines(pose) {
        const hipX = ((pose.keypoints[11].x + pose.keypoints[12].x) / 2 / canvas.width) * 100;
        const now = video.currentTime;
        
        const startX = markers[0];
        const endX = markers[1];
        const direction = endX > startX ? 1 : -1;

        // Start-Linie überquert
        if (!startFrameTime && (direction === 1 ? hipX >= startX : hipX <= startX)) {
            startFrameTime = now;
        }
        
        // Ziel-Linie überquert
        if (startFrameTime && !endFrameTime && (direction === 1 ? hipX >= endX : hipX <= endX)) {
            endFrameTime = now;
            isRunning = false;
            video.pause();
            calculateFinalSpeed();
        }
    }

    function calculateFinalSpeed() {
        const time = endFrameTime - startFrameTime;
        const dist = parseFloat(document.getElementById('sprint-dist').value);
        const avgSpeedKmh = (dist / time) * 3.6;
        
        // Da es ein fliegender Start sein kann, ist der Durchschnitt über die Distanz 
        // oft sehr nah am Top Speed bei kurzen Sprints.
        alert("Sprint beendet!\nZeit: " + time.toFixed(2) + "s\nGeschwindigkeit: " + avgSpeedKmh.toFixed(1) + " km/h");
        location.reload();
    }

    function draw(p) {
        ctx.fillStyle = "#00F5FF";
        p.keypoints.forEach(k => { if(k.score > 0.5) { ctx.beginPath(); ctx.arc(k.x, k.y, 5, 0, 7); ctx.fill(); } });
    }

    init();
</script>
</body>
</html>
