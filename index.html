<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SprintTrack Pro | Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        .viewport { position: relative; flex: 1; background: #050505; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .trigger-zone { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 20px; z-index: 100; pointer-events: none; }
        .t-btn { pointer-events: auto; flex: 1; border: 3px dashed rgba(255,255,255,0.2); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.5rem; transition: all 0.1s; }
        .t-btn:active { background: rgba(0, 245, 255, 0.3); border-color: #00f5ff; transform: scale(0.98); }
        .t-active { border-color: #00f5ff; color: #00f5ff; background: rgba(0, 245, 255, 0.1); }
        .marker { position: absolute; top: 0; bottom: 0; width: 4px; z-index: 50; }
    </style>
</head>
<body>

    <div class="p-6 bg-zinc-900 border-b border-white/10 flex justify-between items-end">
        <div>
            <select id="mode" onchange="toggleMode()" class="bg-transparent text-cyan-400 font-black uppercase text-xs outline-none cursor-pointer">
                <option value="upload">📁 Video Analyse</option>
                <option value="live">🔴 Live Kamera</option>
            </select>
            <div id="status" class="text-[10px] text-white/40 font-bold mt-1 uppercase">Bereit</div>
        </div>
        <div class="text-right">
            <div id="res-time" class="text-3xl font-black italic tracking-tighter text-white">0.00<span class="text-sm">s</span></div>
            <div id="res-kmh" class="text-[10px] font-bold text-cyan-400 uppercase">0.0 km/h</div>
        </div>
    </div>

    <div class="viewport">
        <video id="v" playsinline muted></video>
        
        <div id="live-ui" class="trigger-zone hidden">
            <div id="b-start" class="t-btn" onclick="tap('start')">START</div>
            <div id="b-end" class="t-btn" onclick="tap('end')">ZIEL</div>
        </div>

        <div id="m-start" class="marker bg-cyan-400 hidden" style="left: 0"></div>
        <div id="m-end" class="marker bg-red-500 hidden" style="left: 0"></div>
    </div>

    <div class="p-6 bg-zinc-900 border-t border-white/10 space-y-6">
        
        <div id="upload-ui" class="space-y-4">
            <input type="range" id="seeker" class="w-full h-2 bg-zinc-800 rounded-lg appearance-none accent-cyan-400" step="0.0001" oninput="seek()">
            <div class="flex gap-2">
                <button onclick="step(-1)" class="flex-1 bg-zinc-800 py-4 rounded-xl font-bold">− Frame</button>
                <button onclick="setMark('start')" class="flex-[2] bg-white text-black py-4 rounded-xl font-black text-[10px] uppercase">Start setzen</button>
                <button onclick="setMark('end')" class="flex-[2] bg-white text-black py-4 rounded-xl font-black text-[10px] uppercase">Ziel setzen</button>
                <button onclick="step(1)" class="flex-1 bg-zinc-800 py-4 rounded-xl font-bold">+ Frame</button>
            </div>
        </div>

        <div class="flex gap-4">
            <button onclick="document.getElementById('f').click()" id="f-btn" class="flex-1 bg-white/5 py-4 rounded-xl text-[10px] font-bold uppercase border border-white/10">Video wählen</button>
            <input type="file" id="f" hidden accept="video/*" onchange="load(event)">
            
            <div class="w-24 bg-white/5 rounded-xl border border-white/10 flex flex-col items-center justify-center">
                <span class="text-[8px] opacity-50 font-bold">METER</span>
                <input type="number" id="dist" value="20" class="bg-transparent text-center font-bold text-cyan-400 w-full outline-none">
            </div>
            <button onclick="reset()" class="px-6 py-4 bg-red-500/10 text-red-500 rounded-xl text-[10px] font-bold uppercase">Reset</button>
        </div>
    </div>

<script>
    const v = document.getElementById('v'), s = document.getElementById('seeker');
    let t1 = null, t2 = null, mode = 'upload';

    function toggleMode() {
        mode = document.getElementById('mode').value;
        reset();
        document.getElementById('live-ui').classList.toggle('hidden', mode !== 'live');
        document.getElementById('upload-ui').classList.toggle('hidden', mode !== 'upload');
        document.getElementById('f-btn').classList.toggle('hidden', mode !== 'upload');
        
        if(mode === 'live') {
            navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}})
            .then(stream => v.srcObject = stream)
            .catch(() => alert("Kamera blockiert"));
            v.play();
        } else {
            if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            v.srcObject = null;
        }
    }

    function load(e) {
        const file = e.target.files[0];
        if(file) { v.src = URL.createObjectURL(file); v.onloadedmetadata = () => s.max = v.duration; }
    }

    function seek() { v.currentTime = s.value; document.getElementById('status').innerText = v.currentTime.toFixed(3) + "s"; }
    function step(d) { v.currentTime += (d * 0.033); s.value = v.currentTime; seek(); }

    function tap(type) {
        const time = performance.now();
        if(type === 'start') {
            t1 = time; document.getElementById('b-start').classList.add('t-active');
        } else if(type === 'end' && t1) {
            t2 = time; document.getElementById('b-end').classList.add('t-active');
            finish((t2 - t1)/1000);
        }
    }

    function setMark(type) {
        const p = (v.currentTime / v.duration) * 100;
        if(type === 'start') {
            t1 = v.currentTime; document.getElementById('m-start').style.left = p + '%'; document.getElementById('m-start').classList.remove('hidden');
        } else {
            t2 = v.currentTime; document.getElementById('m-end').style.left = p + '%'; document.getElementById('m-end').classList.remove('hidden');
            finish(Math.abs(t2 - t1));
        }
    }

    function finish(diff) {
        const d = parseFloat(document.getElementById('dist').value);
        const kmh = (d / diff) * 3.6;
        document.getElementById('res-time').innerHTML = `${diff.toFixed(2)}<span class="text-sm">s</span>`;
        document.getElementById('res-kmh').innerText = `${kmh.toFixed(1)} km/h`;
    }

    function reset() {
        t1 = null; t2 = null;
        document.getElementById('res-time').innerHTML = `0.00<span class="text-sm">s</span>`;
        document.getElementById('res-kmh').innerText = `0.0 km/h`;
        document.querySelectorAll('.t-btn, .marker').forEach(el => { el.classList.remove('t-active'); el.classList.add('hidden'); });
    }
</script>
</body>
</html>
