<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SprintTrack Pro | FC 26 Edition</title>
    
    <!-- CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            background-color: #05050A;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100dvh;
        }

        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fc-card-glow {
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.3);
        }

        .neon-text {
            color: #00F5FF;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Kamera & Analysis Layer -->
    <div id="viewport" class="relative flex-1 bg-black overflow-hidden">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="canvas"></canvas>
        
        <!-- HUD Top -->
        <div class="absolute top-10 inset-x-0 px-6 flex justify-between items-start z-50 pointer-events-none">
            <div class="glass rounded-2xl p-3 flex flex-col pointer-events-auto">
                <span class="text-[10px] font-black uppercase tracking-widest opacity-50">Status</span>
                <span id="status-text" class="text-xs font-bold text-cyan-400 uppercase">Warte auf Kamera...</span>
            </div>
            <div id="speed-bubble" class="hidden glass rounded-2xl p-3 flex flex-col text-right pointer-events-auto">
                <span id="live-speed" class="text-3xl font-black italic">0.0</span>
                <span class="text-[8px] font-bold uppercase tracking-widest opacity-50">KM/H</span>
            </div>
        </div>

        <!-- Timer / Start Overlay -->
        <div id="timer-overlay" class="hidden absolute inset-0 flex items-center justify-center bg-black/40 z-[60] pointer-events-none">
            <div id="timer-val" class="text-9xl font-black italic neon-text">3</div>
        </div>
    </div>

    <!-- Controls Bottom -->
    <div id="controls" class="glass w-full p-6 pb-10 flex flex-col gap-4 z-50">
        <div id="setup-controls" class="flex flex-col gap-4">
            <p class="text-[10px] uppercase font-black tracking-widest opacity-50 text-center">Setup: Markiere Start & Ziel im Video</p>
            <div class="flex gap-2">
                <button onclick="resetCalibration()" class="flex-1 py-3 bg-white/5 rounded-xl text-xs font-bold uppercase tracking-widest border border-white/10 active:bg-white/10">Reset</button>
                <button id="start-btn" onclick="startSprint()" class="flex-[2] py-4 bg-cyan-500 rounded-xl text-black font-black text-sm uppercase tracking-widest shadow-[0_0_20px_rgba(0,245,255,0.4)] active:scale-95 transition-transform">Analyse Starten</button>
            </div>
        </div>
    </div>

    <!-- FIFA RESULT CARD -->
    <div id="result-overlay" class="hidden fixed inset-0 z-[100] bg-black/90 backdrop-blur-2xl flex flex-col items-center justify-center p-6">
        <div id="fc-card" class="relative w-72 h-[420px] rounded-[2.5rem] p-1 overflow-hidden transition-all duration-700 scale-50 opacity-0">
            <!-- Card Background -->
            <div id="card-bg" class="absolute inset-0 bg-gradient-to-br from-amber-200 via-yellow-400 to-amber-600"></div>
            
            <!-- Card Content -->
            <div class="relative h-full w-full flex flex-col items-center text-slate-900 italic font-black uppercase pt-8">
                <div class="flex flex-col items-center">
                    <span id="card-pace" class="text-7xl leading-none">97</span>
                    <span class="text-xl tracking-tighter -mt-1">PAC</span>
                </div>
                
                <div class="w-44 h-44 bg-black/10 rounded-full mt-2 flex items-center justify-center overflow-hidden border-4 border-black/5">
                    <span class="text-8xl mt-4 opacity-40">👤</span>
                </div>

                <div class="text-3xl tracking-tighter mt-2 border-b-2 border-slate-900/20 w-4/5 text-center pb-1">DU</div>
                
                <div class="grid grid-cols-2 gap-x-6 gap-y-1 text-[11px] mt-4 w-3/4">
                    <div class="flex justify-between border-b border-slate-900/10"><span>KMH</span><span id="res-kmh">38.0</span></div>
                    <div class="flex justify-between border-b border-slate-900/10"><span>ACC</span><span>92</span></div>
                    <div class="flex justify-between border-b border-slate-900/10"><span>STA</span><span>85</span></div>
                    <div class="flex justify-between border-b border-slate-900/10"><span>DRI</span><span>78</span></div>
                </div>

                <div class="mt-auto mb-6 flex flex-col items-center opacity-60">
                    <span class="text-[8px] tracking-widest mb-1">Vergleich</span>
                    <span id="star-name" class="text-xs bg-black/10 px-4 py-1 rounded-full">K. Mbappé</span>
                </div>
            </div>
            
            <!-- Glossy Effect -->
            <div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/30 to-white/0 pointer-events-none"></div>
        </div>

        <button onclick="closeResult()" class="mt-10 py-4 px-12 bg-white/10 hover:bg-white/20 text-white rounded-full font-black uppercase tracking-widest transition-all">Zurück</button>
    </div>
</div>

<script>
    // --- State & Config ---
    const state = {
        detector: null,
        isMeasuring: false,
        calPoints: [], // max 2
        pxm: 0, // pixels per meter
        realDistance: 20, // default 20m sprint
        peakKmh: 0,
        samples: [],
        lastPos: null,
        lastTime: null
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // --- TFJS Setup ---
    async function initApp() {
        try {
            updateStatus('Lade AI Modell...');
            await tf.setBackend('webgl');
            await tf.ready();
            
            const model = poseDetection.SupportedModels.BlazePose;
            const detectorConfig = {
                runtime: 'tfjs',
                modelType: 'lite'
            };
            state.detector = await poseDetection.createDetector(model, detectorConfig);
            
            updateStatus('Starte Kamera...');
            await startCamera();
            
            updateStatus('Bereit');
            requestAnimationFrame(renderLoop);
        } catch (err) {
            console.error(err);
            updateStatus('Fehler: ' + err.message);
        }
    }

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        video.srcObject = stream;
        return new Promise(resolve => video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            resolve();
        });
    }

    // --- Analysis Engine ---
    async function renderLoop() {
        if (video.readyState >= 2) {
            const poses = await state.detector.estimatePoses(video);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawCalibrationMarkers();

            if (poses && poses[0]) {
                const pose = poses[0];
                drawPose(pose);
                
                if (state.isMeasuring) {
                    processMotion(pose);
                }
            }
        }
        requestAnimationFrame(renderLoop);
    }

    function processMotion(pose) {
        const k = pose.keypoints;
        // Nutze Hüft-Mittelpunkt als Tracker
        const hipL = k[23], hipR = k[24];
        if (hipL.score < 0.5 || hipR.score < 0.5) return;

        const centerX = (hipL.x + hipR.x) / 2;
        const centerY = (hipL.y + hipR.y) / 2;
        const now = performance.now();

        if (state.lastPos && state.lastTime) {
            const dt = (now - state.lastTime) / 1000;
            const dx = Math.hypot(centerX - state.lastPos.x, centerY - state.lastPos.y);
            
            if (state.pxm > 0 && dt > 0) {
                const meters = dx / state.pxm;
                const speedMs = meters / dt;
                const kmh = speedMs * 3.6;

                // Filter Outliers (über 50 km/h ist unrealistisch)
                if (kmh < 50) {
                    state.samples.push(kmh);
                    // EMA Smoothing
                    state.peakKmh = Math.max(state.peakKmh, kmh);
                    document.getElementById('live-speed').innerText = kmh.toFixed(1);
                }
            }
        }

        state.lastPos = { x: centerX, y: centerY };
        state.lastTime = now;
    }

    // --- Drawing ---
    function drawPose(pose) {
        ctx.fillStyle = '#00F5FF';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        
        // Zeichne nur Oberkörper-Keypoints für Fokus
        const relevant = [11, 12, 23, 24]; 
        relevant.forEach(idx => {
            const kp = pose.keypoints[idx];
            if (kp.score > 0.5) {
                ctx.beginPath();
                ctx.arc(kp.x, kp.y, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        });
    }

    function drawCalibrationMarkers() {
        state.calPoints.forEach((p, i) => {
            ctx.fillStyle = i === 0 ? '#ff4444' : '#00ff88';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Inter';
            ctx.fillText(i === 0 ? 'START (0m)' : 'ZIEL (20m)', p.x + 20, p.y + 5);
        });

        if (state.calPoints.length === 2) {
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.moveTo(state.calPoints[0].x, state.calPoints[0].y);
            ctx.lineTo(state.calPoints[1].x, state.calPoints[1].y);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // --- Interactions ---
    canvas.addEventListener('click', (e) => {
        if (state.isMeasuring) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        if (state.calPoints.length < 2) {
            state.calPoints.push({ x, y });
            if (state.calPoints.length === 2) {
                const distPx = Math.hypot(state.calPoints[1].x - state.calPoints[0].x, state.calPoints[1].y - state.calPoints[0].y);
                state.pxm = distPx / state.realDistance;
                updateStatus('Kalibriert: ' + state.realDistance + 'm');
            }
        }
    });

    function resetCalibration() {
        state.calPoints = [];
        state.pxm = 0;
        state.peakKmh = 0;
        updateStatus('Punkte zurückgesetzt');
    }

    async function startSprint() {
        if (state.calPoints.length < 2) {
            alert("Bitte zuerst Start- und Endpunkt im Video markieren!");
            return;
        }

        document.getElementById('setup-controls').classList.add('hidden');
        document.getElementById('timer-overlay').classList.remove('hidden');
        
        let count = 3;
        const timerVal = document.getElementById('timer-val');
        
        const countdown = setInterval(() => {
            count--;
            if (count > 0) {
                timerVal.innerText = count;
            } else {
                clearInterval(countdown);
                timerVal.innerText = "GO!";
                setTimeout(() => {
                    document.getElementById('timer-overlay').classList.add('hidden');
                    runAnalysis();
                }, 500);
            }
        }, 1000);
    }

    function runAnalysis() {
        state.isMeasuring = true;
        state.peakKmh = 0;
        state.samples = [];
        document.getElementById('speed-bubble').classList.remove('hidden');
        updateStatus('ANALYSE LÄUFT...');

        // Automatischer Stop nach 4 Sekunden
        setTimeout(() => {
            stopSprint();
        }, 4000);
    }

    function stopSprint() {
        state.isMeasuring = false;
        document.getElementById('speed-bubble').classList.add('hidden');
        document.getElementById('setup-controls').classList.remove('hidden');
        updateStatus('Bereit');
        showResult();
    }

    // --- FIFA Card Logic ---
    function showResult() {
        const overlay = document.getElementById('result-overlay');
        const card = document.getElementById('fc-card');
        const cardBg = document.getElementById('card-bg');
        const paceEl = document.getElementById('card-pace');
        const kmhEl = document.getElementById('res-kmh');
        const starEl = document.getElementById('star-name');

        const speed = state.peakKmh;
        // Logik: 38 km/h = 97 Pace, 15 km/h = 40 Pace
        const pace = Math.min(99, Math.max(10, Math.round(((speed - 15) / (38 - 15)) * (97 - 40) + 40)));
        
        paceEl.innerText = pace;
        kmhEl.innerText = speed.toFixed(1);

        // Card Styles
        if (speed > 30) {
            cardBg.className = "absolute inset-0 bg-gradient-to-br from-amber-200 via-yellow-400 to-amber-600";
            starEl.innerText = "Alphonso Davies";
        } else if (speed > 20) {
            cardBg.className = "absolute inset-0 bg-gradient-to-br from-slate-200 via-gray-400 to-slate-500";
            starEl.innerText = "Kyle Walker";
        } else {
            cardBg.className = "absolute inset-0 bg-gradient-to-br from-orange-400 via-orange-300 to-orange-700";
            starEl.innerText = "Harry Kane";
        }

        overlay.classList.remove('hidden');
        setTimeout(() => {
            card.style.transform = "scale(1)";
            card.style.opacity = "1";
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }, 100);
    }

    function closeResult() {
        document.getElementById('result-overlay').classList.add('hidden');
        const card = document.getElementById('fc-card');
        card.style.transform = "scale(0.5)";
        card.style.opacity = "0";
    }

    function updateStatus(txt) {
        document.getElementById('status-text').innerText = txt;
    }

    // Start
    initApp();
</script>

</body>
</html>
