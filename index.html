<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SprintTrack Pro | Professional Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { margin: 0; background-color: #05050A; color: white; font-family: sans-serif; overflow: hidden; height: 100dvh; }
        .glass { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        
        /* Landscape Warning */
        #landscape-warning {
            display: none; position: fixed; inset: 0; background: #05050A; z-index: 999;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        @media (orientation: portrait) { #landscape-warning { display: flex; } }

        .active-marker { border-color: #00F5FF; color: #00F5FF; box-shadow: 0 0 10px rgba(0, 245, 255, 0.3); }
    </style>
</head>
<body>

<div id="landscape-warning" class="p-10">
    <div class="text-5xl mb-6">🔄</div>
    <h2 class="text-2xl font-black uppercase tracking-widest">Bitte Handy drehen</h2>
    <p class="opacity-60 mt-2 text-sm">Für die Analyse ist das Querformat (Landscape) erforderlich.</p>
</div>

<div id="app-container" class="relative w-full h-full flex flex-row">
    <div id="viewport" class="relative flex-[3] bg-black overflow-hidden border-r border-white/10">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        
        <div id="speed-bubble" class="hidden absolute top-6 right-6 glass rounded-2xl p-4 text-right z-50">
            <span id="live-speed" class="text-5xl font-black italic text-cyan-400">0.0</span>
            <span class="text-[10px] font-bold block opacity-50 uppercase">KM/H</span>
        </div>

        <div id="status-tag" class="absolute top-6 left-6 glass px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-[2px] text-cyan-400 z-50">
            Warte auf Video
        </div>
    </div>

    <div id="sidebar" class="flex-1 glass p-6 flex flex-col gap-4 overflow-y-auto">
        <h1 class="text-lg font-black italic uppercase tracking-tighter border-b border-white/10 pb-2">SprintTrack <span class="text-cyan-400">Pro</span></h1>
        
        <div>
            <label class="text-[9px] font-bold uppercase opacity-50 block mb-1 tracking-widest">1. Video Setup</label>
            <button onclick="document.getElementById('file-input').click()" class="w-full py-3 bg-white/10 rounded-xl text-[10px] font-bold uppercase hover:bg-white/20 transition-all">Datei auswählen</button>
            <input type="file" id="file-input" hidden accept="video/*" onchange="handleFileUpload(event)">
        </div>

        <div class="space-y-2">
            <label class="text-[9px] font-bold uppercase opacity-50 block mb-1 tracking-widest">2. Marker setzen</label>
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-start" onclick="setMarker('start')" class="py-3 border border-white/10 rounded-xl text-[9px] font-bold uppercase">Start Zeit</button>
                <button id="btn-end" onclick="setMarker('end')" class="py-3 border border-white/10 rounded-xl text-[9px] font-bold uppercase">End Zeit</button>
            </div>
            <p class="text-[8px] opacity-40 text-center italic">Spule im Video und setze die Zeitpunkte</p>
        </div>

        <div>
            <label class="text-[9px] font-bold uppercase opacity-50 block mb-1 tracking-widest">3. Körpergröße (m)</label>
            <input type="number" id="user-height" value="1.80" step="0.01" class="w-full bg-white/5 border border-white/10 rounded-xl py-2 px-4 text-cyan-400 font-bold outline-none focus:border-cyan-400">
        </div>

        <div class="mt-auto pt-4 space-y-3">
            <button id="play-btn" onclick="togglePlay()" class="w-full py-3 glass rounded-xl text-xs font-bold uppercase">Play / Pause</button>
            <button id="analyze-btn" onclick="runFinalAnalysis()" class="w-full py-5 bg-cyan-500 rounded-2xl text-black font-black text-sm uppercase tracking-widest shadow-lg shadow-cyan-500/20 active:scale-95 transition-all">Analyse Starten</button>
        </div>
    </div>

    <div id="result-overlay" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-3xl flex items-center justify-center p-6">
        <div id="fc-card" class="relative w-64 h-96 rounded-[2rem] overflow-hidden transition-all duration-700">
            <div id="card-bg" class="absolute inset-0 bg-gradient-to-br from-yellow-300 via-yellow-500 to-amber-600"></div>
            <div class="relative h-full flex flex-col items-center pt-10 text-slate-900 font-black italic uppercase">
                <span id="card-pace" class="text-7xl">0</span>
                <span class="text-xl -mt-2">PAC</span>
                <div class="text-3xl mt-12 border-b-2 border-black/20 w-4/5 text-center">SPRINTER</div>
                <span id="res-kmh" class="mt-4 text-lg opacity-80">0.0 KM/H</span>
            </div>
        </div>
        <button onclick="location.reload()" class="ml-10 py-4 px-10 bg-white/10 border border-white/20 rounded-full font-bold uppercase hover:bg-white/20">Neu</button>
    </div>
</div>

<script>
    const state = {
        detector: null,
        startTime: 0,
        endTime: 0,
        isMeasuring: false,
        peakKmh: 0,
        speedBuffer: [],
        lastPos: null,
        lastTime: null
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function init() {
        state.detector = await poseDetection.createDetector(poseDetection.SupportedModels.BlazePose, { runtime: 'tfjs', modelType: 'lite' });
        document.getElementById('status-tag').innerText = "Bereit";
        render();
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                state.endTime = video.duration;
                document.getElementById('status-tag').innerText = "Video geladen";
            };
        }
    }

    function togglePlay() { video.paused ? video.play() : video.pause(); }

    function setMarker(type) {
        if (type === 'start') {
            state.startTime = video.currentTime;
            document.getElementById('btn-start').classList.add('active-marker');
        } else {
            state.endTime = video.currentTime;
            document.getElementById('btn-end').classList.add('active-marker');
        }
    }

    function runFinalAnalysis() {
        if (state.endTime <= state.startTime) return alert("Fehler: Endzeit muss nach Startzeit liegen!");
        video.currentTime = state.startTime;
        video.play();
        state.isMeasuring = true;
        state.peakKmh = 0;
        state.speedBuffer = [];
        document.getElementById('speed-bubble').classList.remove('hidden');
        document.getElementById('status-tag').innerText = "Analysiere...";
    }

    function render() {
        if (video.readyState >= 2) {
            if (state.isMeasuring && video.currentTime >= state.endTime) {
                state.isMeasuring = false;
                video.pause();
                showResult();
            }

            state.detector.estimatePoses(video).then(poses => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (poses && poses[0]) {
                    const pose = poses[0];
                    drawPose(pose);
                    if (state.isMeasuring) processAnalysis(pose);
                }
            });
        }
        requestAnimationFrame(render);
    }

    function processAnalysis(pose) {
        const k = pose.keypoints;
        const curTime = video.currentTime;
        const userH = parseFloat(document.getElementById('user-height').value) || 1.80;

        // Pixel-Höhe (Kopf bis Fuß)
        const pxH = Math.abs(((k[27].y + k[28].y)/2) - ((k[11].y + k[12].y)/2));
        const curX = (k[23].x + k[24].x) / 2; // Hüfte
        const now = curTime;

        if (state.lastPos && now !== state.lastTime && pxH > 20) {
            const dt = now - state.lastTime;
            const dx = Math.hypot(curX - state.lastPos.x, ( (k[23].y+k[24].y)/2 ) - state.lastPos.y);
            const pxm = pxH / userH;
            const speedKmh = ((dx / pxm) / dt) * 3.6;

            if (speedKmh > 0 && speedKmh < 60) {
                state.speedBuffer.push(speedKmh);
                if (state.speedBuffer.length > 5) state.speedBuffer.shift();
                const avg = state.speedBuffer.reduce((a,b)=>a+b,0) / state.speedBuffer.length;
                state.peakKmh = Math.max(state.peakKmh, avg);
                document.getElementById('live-speed').innerText = avg.toFixed(1);
            }
        }
        state.lastPos = { x: curX, y: (k[23].y+k[24].y)/2 };
        state.lastTime = now;
    }

    function drawPose(pose) {
        ctx.fillStyle = '#00F5FF';
        [11, 12, 23, 24, 27, 28].forEach(i => {
            const kp = pose.keypoints[i];
            if (kp.score > 0.5) {
                ctx.beginPath(); ctx.arc(kp.x, kp.y, 6, 0, Math.PI*2); ctx.fill();
            }
        });
    }

    function showResult() {
        const pace = Math.min(99, Math.max(10, Math.round(((state.peakKmh - 15) / (38 - 15)) * 57 + 40)));
        document.getElementById('card-pace').innerText = pace;
        document.getElementById('res-kmh').innerText = state.peakKmh.toFixed(1) + " KM/H";
        document.getElementById('result-overlay').classList.remove('hidden');
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    init();
</script>
</body>
</html>
