<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SprintTrack Pro | AI Auto-Start</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { margin: 0; background-color: #05050A; color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100dvh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .neon-text { color: #00F5FF; text-shadow: 0 0 15px rgba(0, 245, 255, 0.7); }
        .ready-pulse { animation: pulse 1.5s infinite; color: #fbbf24; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="app-container" class="relative w-full h-full flex flex-col">
    <div id="viewport" class="relative flex-1 overflow-hidden bg-black">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="canvas"></canvas>
        
        <div class="absolute top-10 inset-x-0 px-6 flex justify-between items-start z-50">
            <div class="glass rounded-2xl p-3">
                <span id="status-text" class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Initialisiere...</span>
            </div>
            <button onclick="location.reload()" class="glass rounded-full w-12 h-12 flex items-center justify-center text-xl">🔄</button>
        </div>

        <div id="speed-bubble" class="hidden absolute top-32 right-6 glass rounded-2xl p-4 text-right z-50">
            <span id="live-speed" class="text-5xl font-black italic text-cyan-400">0.0</span>
            <span class="text-[10px] font-bold block opacity-50 uppercase">KM/H</span>
        </div>

        <div id="trigger-overlay" class="hidden absolute inset-0 flex items-center justify-center bg-black/40 z-[60]">
            <div id="trigger-msg" class="text-6xl font-black italic ready-pulse uppercase text-center px-6">Ready<br><span class="text-2xl not-italic opacity-70">Lauf los, wenn du bereit bist</span></div>
        </div>
    </div>

    <div id="controls" class="glass w-full p-6 pb-10 flex flex-col gap-4 z-50 rounded-t-[2.5rem]">
        <div class="flex flex-col gap-1">
            <label class="text-[10px] font-black uppercase tracking-[2px] opacity-60 ml-2">Körpergröße (m)</label>
            <input type="number" id="user-height" value="1.80" step="0.01" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-5 text-cyan-400 font-bold outline-none">
        </div>

        <div class="flex gap-3">
            <button onclick="document.getElementById('file-input').click()" class="flex-1 py-4 glass rounded-xl text-[10px] font-bold uppercase">📁 Video</button>
            <button id="start-btn" onclick="armTrigger()" class="flex-[2] py-5 bg-cyan-500 rounded-2xl text-black font-black text-lg uppercase tracking-[2px] active:scale-95 transition-all">Analyse Start</button>
        </div>
        <input type="file" id="file-input" hidden accept="video/*" onchange="handleFileUpload(event)">
    </div>

    <div id="result-overlay" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-3xl flex flex-col items-center justify-center p-6">
        <div id="fc-card" class="relative w-72 h-[420px] rounded-[2.5rem] p-1 overflow-hidden transition-all duration-700 scale-50 opacity-0 shadow-[0_0_50px_rgba(0,245,255,0.3)]">
            <div id="card-bg" class="absolute inset-0 bg-gradient-to-br from-amber-200 via-yellow-400 to-amber-600"></div>
            <div class="relative h-full flex flex-col items-center pt-10 text-slate-900 font-black italic uppercase">
                <span id="card-pace" class="text-7xl leading-none">0</span>
                <span class="text-xl -mt-1">PAC</span>
                <div class="w-40 h-40 bg-black/10 rounded-full mt-4 flex items-center justify-center overflow-hidden border-4 border-black/5"><span class="text-7xl opacity-40">👤</span></div>
                <div class="text-3xl mt-4 border-b-2 border-slate-900/20 w-4/5 text-center pb-1">SPRINTER</div>
                <div class="mt-4 flex flex-col items-center opacity-70">
                    <span class="text-[9px] tracking-widest">Top Speed</span>
                    <span id="res-kmh" class="text-lg">0.0 km/h</span>
                </div>
            </div>
        </div>
        <button onclick="location.reload()" class="mt-8 py-4 px-12 bg-cyan-500 text-black rounded-full font-black uppercase active:scale-95 transition-all">Nochmal</button>
    </div>
</div>

<script>
    const state = {
        detector: null,
        isArmed: false, // Wartet auf Bewegung
        isMeasuring: false, // Misst gerade den Sprint
        peakKmh: 0,
        speedBuffer: [],
        lastPos: null,
        lastTime: null,
        startRecognizedTime: 0
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function init() {
        state.detector = await poseDetection.createDetector(poseDetection.SupportedModels.BlazePose, { runtime: 'tfjs', modelType: 'lite' });
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 640, height: 480 } });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            document.getElementById('status-text').innerText = "Bereit";
            render();
        };
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (file) {
            video.srcObject = null;
            video.src = URL.createObjectURL(file);
            video.play();
        }
    }

    function armTrigger() {
        state.isArmed = true;
        state.peakKmh = 0;
        state.speedBuffer = [];
        document.getElementById('trigger-overlay').classList.remove('hidden');
        document.getElementById('status-text').innerText = "Warte auf Start...";
    }

    function render() {
        if (video.readyState >= 2) {
            state.detector.estimatePoses(video).then(poses => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (poses && poses[0]) {
                    const pose = poses[0];
                    drawPose(pose);
                    processAnalysis(pose);
                }
            });
        }
        requestAnimationFrame(render);
    }

    function processAnalysis(pose) {
        const k = pose.keypoints;
        const now = performance.now();
        const userH = parseFloat(document.getElementById('user-height').value) || 1.80;

        // Pixelhöhe & Trackingpunkt (Hüfte)
        const pxH = Math.abs(((k[27].y + k[28].y)/2) - ((k[11].y + k[12].y)/2));
        const curX = (k[23].x + k[24].x) / 2;
        const curY = (k[23].y + k[24].y) / 2;

        if (state.lastPos && pxH > 20) {
            const dt = (now - state.lastTime) / 1000;
            const dx = Math.hypot(curX - state.lastPos.x, curY - state.lastPos.y);
            const kmh = ((dx / (pxH / userH)) / dt) * 3.6;

            if (kmh < 55) { // Glättung & Plausibilität
                state.speedBuffer.push(kmh);
                if (state.speedBuffer.length > 5) state.speedBuffer.shift();
                const avg = state.speedBuffer.reduce((a,b)=>a+b,0) / state.speedBuffer.length;

                // AUTOMATISCHER START-TRIGGER
                if (state.isArmed && avg > 3.5) {
                    state.isArmed = false;
                    state.isMeasuring = true;
                    state.startRecognizedTime = now;
                    document.getElementById('trigger-overlay').classList.add('hidden');
                    document.getElementById('speed-bubble').classList.remove('hidden');
                    document.getElementById('status-text').innerText = "GO! GO! GO!";
                }

                if (state.isMeasuring) {
                    state.peakKmh = Math.max(state.peakKmh, avg);
                    document.getElementById('live-speed').innerText = avg.toFixed(1);

                    // Automatisch nach 5 Sekunden stoppen
                    if (now - state.startRecognizedTime > 5000) {
                        state.isMeasuring = false;
                        showResult();
                    }
                }
            }
        }
        state.lastPos = { x: curX, y: curY };
        state.lastTime = now;
    }

    function drawPose(pose) {
        ctx.fillStyle = '#00F5FF';
        [11, 12, 23, 24, 27, 28].forEach(i => {
            const kp = pose.keypoints[i];
            if (kp.score > 0.5) {
                ctx.beginPath(); ctx.arc(kp.x, kp.y, 6, 0, Math.PI*2); ctx.fill();
            }
        });
    }

    function showResult() {
        const pace = Math.min(99, Math.max(10, Math.round(((state.peakKmh - 15) / (38 - 15)) * 57 + 40)));
        document.getElementById('card-pace').innerText = pace;
        document.getElementById('res-kmh').innerText = state.peakKmh.toFixed(1) + " km/h";
        
        document.getElementById('result-overlay').classList.remove('hidden');
        setTimeout(() => { 
            document.getElementById('fc-card').style.transform = "scale(1)"; 
            document.getElementById('fc-card').style.opacity = "1"; 
        }, 100);
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    init();
</script>
</body>
</html>
