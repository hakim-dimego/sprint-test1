<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SprintEditor | Frame-Precision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .viewport { position: relative; flex: 1; background: #050505; display: flex; flex-direction: column; justify-content: center; }
        video { width: 100%; max-height: 50dvh; }
        
        /* Fortschrittsbalken mit Markern */
        .timeline-container { position: relative; width: 100%; height: 40px; background: #111; margin-top: 10px; }
        #seeker { position: absolute; width: 100%; top: 0; z-index: 20; height: 100%; opacity: 0.3; cursor: pointer; }
        .track { position: absolute; top: 50%; left: 0; right: 0; height: 4px; background: #333; transform: translateY(-50%); }
        .marker { position: absolute; top: 0; bottom: 0; width: 4px; z-index: 10; pointer-events: none; }
        .marker-start { background: #00f5ff; box-shadow: 0 0 10px #00f5ff; }
        .marker-end { background: #ff3b30; box-shadow: 0 0 10px #ff3b30; }
        
        .glass-ui { background: rgba(20, 20, 25, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-frame { background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="p-4 flex justify-between items-center border-b border-white/10">
        <h1 class="text-cyan-400 font-black italic uppercase text-xs tracking-widest">Frame Precision v2</h1>
        <div class="flex gap-4 items-baseline">
            <span id="speed-res" class="text-2xl font-black text-cyan-400">0.0</span>
            <span class="text-[10px] opacity-50 font-bold uppercase">km/h</span>
        </div>
    </div>

    <div class="viewport">
        <video id="video" playsinline preload="auto"></video>
        
        <div class="timeline-container px-4">
            <div class="relative h-full w-full">
                <div class="track"></div>
                <div id="m-start" class="marker marker-start hidden"></div>
                <div id="m-end" class="marker marker-end hidden"></div>
                <input type="range" id="seeker" value="0" step="0.0001" oninput="updateSeek()">
            </div>
        </div>

        <div class="flex justify-center gap-6 p-4">
            <button onclick="changeFrame(-1)" class="btn-frame">− Frame</button>
            <div id="time-display" class="text-xl font-mono font-bold w-32 text-center text-white/80">0.000s</div>
            <button onclick="changeFrame(1)" class="btn-frame">+ Frame</button>
        </div>
    </div>

    <div class="glass-ui p-6 pb-10 space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <button onclick="mark('start')" class="bg-cyan-500 text-black py-4 rounded-2xl font-black uppercase text-xs shadow-lg shadow-cyan-500/20">Start hier</button>
            <button onclick="mark('end')" class="bg-red-500 text-white py-4 rounded-2xl font-black uppercase text-xs shadow-lg shadow-red-500/20">Ziel hier</button>
        </div>

        <div class="flex gap-4">
            <button onclick="document.getElementById('file').click()" class="flex-1 bg-white/5 py-4 rounded-xl text-[10px] font-bold uppercase border border-white/10">📁 Video laden</button>
            <input type="file" id="file" hidden accept="video/*" onchange="load(event)">
            
            <div class="w-24 bg-white/5 rounded-xl border border-white/10 flex flex-col items-center justify-center">
                <span class="text-[8px] opacity-50 font-bold uppercase">Meter</span>
                <input type="number" id="dist" value="20" class="bg-transparent text-center font-bold text-cyan-400 w-full outline-none">
            </div>
        </div>

        <button onclick="calc()" class="w-full py-5 bg-white text-black font-black rounded-3xl uppercase tracking-[2px]">Berechnen</button>
    </div>

<script>
    const v = document.getElementById('video');
    const s = document.getElementById('seeker');
    let start = null, end = null;

    function load(e) {
        const f = e.target.files[0];
        if (f) {
            v.src = URL.createObjectURL(f);
            v.onloadedmetadata = () => { s.max = v.duration; };
        }
    }

    function updateSeek() {
        v.currentTime = s.value;
        document.getElementById('time-display').innerText = v.currentTime.toFixed(3) + "s";
    }

    function changeFrame(dir) {
        v.currentTime += (dir * 0.033); // Ca. 1 Frame bei 30fps
        s.value = v.currentTime;
        updateSeek();
    }

    function mark(type) {
        const p = (v.currentTime / v.duration) * 100;
        if (type === 'start') {
            start = v.currentTime;
            document.getElementById('m-start').style.left = p + '%';
            document.getElementById('m-start').classList.remove('hidden');
        } else {
            end = v.currentTime;
            document.getElementById('m-end').style.left = p + '%';
            document.getElementById('m-end').classList.remove('hidden');
        }
    }

    function calc() {
        if (start === null || end === null) return alert("Beide Marker setzen!");
        const diff = Math.abs(end - start);
        const d = parseFloat(document.getElementById('dist').value);
        const kmh = (d / diff) * 3.6;
        document.getElementById('speed-res').innerText = kmh.toFixed(1);
        alert(`Zeit: ${diff.toFixed(3)}s\nGeschwindigkeit: ${kmh.toFixed(1)} km/h`);
    }
</script>
</body>
</html>
